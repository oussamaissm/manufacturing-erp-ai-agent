[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-ai-platform"
version = "0.1.0"
description = "Agentic ERP assistant over ERPNext: LangGraph tools, RAG, inference benchmarks, FastAPI service"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0", "langchain-core>=1.0", "langchain-ollama>=1.0", "ollama>=0.6",
  "chromadb>=1.0", "langchain-groq>=0.3", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.7", "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
industrial_ai = ["api/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
