<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Industrial AI Assistant</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b2430; --muted:#6b7686; --line:#e1e5ea; --accent:#2f5d8a; --user:#e8f0f8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --card:#1c222a; --ink:#e6e9ee; --muted:#93a0b0; --line:#2b333d; --accent:#6fa3d6; --user:#22334a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); display:flex; justify-content:center; }
  main { width:min(820px,100%); height:100vh; display:flex; flex-direction:column; padding:16px; gap:12px; }
  header { display:flex; align-items:baseline; justify-content:space-between; }
  h1 { font-size:18px; margin:0; }
  #status { font-size:12px; color:var(--muted); }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:4px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:12px; background:var(--card); border:1px solid var(--line); white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:var(--user); border-color:transparent; }
  .tools { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font:12px ui-monospace,Consolas,monospace; color:var(--accent); border:1px solid var(--line); border-radius:999px; padding:2px 10px; cursor:help; }
  .meta { margin-top:6px; font-size:12px; color:var(--muted); }
  form { display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  button { padding:0 18px; border-radius:10px; border:0; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
 </style>
</head>
<body>
<main>
  <header><h1>Industrial AI Assistant</h1><span id="status">connecting…</span></header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <input id="input" placeholder="Ask about machines, orders, stock or procedures…" autocomplete="off" autofocus>
    <button id="send">Send</button>
  </form>
</main>
<script>
const log = document.getElementById('log'), form = document.getElementById('form'),
      input = document.getElementById('input'), send = document.getElementById('send');
let threadId = sessionStorage.getItem('thread') || null;

function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  log.append(d); log.scrollTop = log.scrollHeight; return d;
}

fetch('/api/health').then(r => r.json()).then(h => {
  document.getElementById('status').textContent =
    (h.erp_reachable ? 'ERP connected' : 'ERP unreachable') + (h.rag_enabled ? ' · documents on' : '');
}).catch(() => document.getElementById('status').textContent = 'API unreachable');

form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim(); if (!text) return;
  input.value = ''; add('user', text); send.disabled = true;
  const pending = add('bot', 'Thinking…');
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
                                          body: JSON.stringify({ message: text, thread_id: threadId }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    threadId = data.thread_id; sessionStorage.setItem('thread', threadId);
    pending.textContent = data.answer || '(empty answer)';
    if (data.tool_calls.length) {
      const box = document.createElement('div'); box.className = 'tools';
      data.tool_calls.forEach(c => { const s = document.createElement('span'); s.className = 'chip';
        s.textContent = c.name + '(' + Object.values(c.args).join(', ') + ')'; s.title = c.result_preview; box.append(s); });
      pending.append(box);
    }
    const m = document.createElement('div'); m.className = 'meta'; m.textContent = data.elapsed_s + ' s'; pending.append(m);
  } catch (err) { pending.textContent = 'Error: ' + err.message; }
  send.disabled = false; input.focus(); log.scrollTop = log.scrollHeight;
});
</script>
</body>
</html>
